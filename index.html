<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDriveVN</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" style="display:none; position:fixed; inset:0; background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%); z-index:1000; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
        <h1 style="font-size:3rem; color:#3b82f6;">🚍 BUSDRIVEVN</h1>
        <p id="loading-tip" style="color:#94a3b8; font-size:1.2rem; margin-top:10px;">HÃY LÁI XE AN TOÀN!</p>
        <div style="width:300px; height:6px; background:#334155; border-radius:3px; overflow:hidden; margin-top:30px;">
            <div id="loading-progress-bar" style="width:0%; height:100%; background:#3b82f6; transition:width 0.3s ease;"></div>
        </div>
        <p id="loading-status" style="color:#64748b; margin-top:15px;"></p>
    </div>

<!-- MAIN MENU GỐC -->
    <div id="main-menu" style="display:flex;">
        <img src="assets/ui/title.png" id="game-logo" alt="BusDriveVN Logo">
        <button id="btn-new-game">🚍 LÁI XE THÔI!</button>
      <button id="btn-uv-skin">🎨 THÊM UV SKIN</button>
      <button id="btn-settings-main">⚙ CÀI ĐẾT</button>
    </div>

    <!-- UV SKIN PANEL -->
    <div id="uv-skin-panel" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1e293b; padding:30px; border-radius:10px; z-index:100; text-align:center;">
        <h2>🎨 THÊM UV SKIN</h2>
        <p>Chọn file PNG UV Skin của bạn (2048 x 1024).</p>
        <button id="btn-choose-skin" style="padding:10px 20px; margin:10px; cursor:pointer; background:#3b82f6; color:#fff; border:none; border-radius:5px;">📁 CHỌN FILE</button>
        <p id="uv-skin-status" style="color:#fff; margin-top:10px;"></p>
        <a id="uv-skin-download" style="display:none; margin-top:10px; color:#3b82f6;" download="bus_final.png">⬇ TẢI XUỐNG bus_final.png</a>
        <br><button id="btn-close-uv-skin" style="padding:5px 15px; margin-top:20px; cursor:pointer; background:#ef4444; color:#fff; border:none; border-radius:5px;">ĐÓNG</button>
    </div>

    <!-- SETTINGS PANEL -->
    <div id="settings-panel" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1e293b; padding:30px; border-radius:10px; z-index:100; width:300px;">
        <h2 style="text-align:center; color:#fff;">⚙ CÀI ĐẾT</h2>
        <div style="margin:15px 0; color:#fff;">
            <label>Chất lượng đồ họa:</label><br>
            <select id="setting-graphics"><option value="low">Thấp</option><option value="medium">Trung bình</option><option value="high">Cao</option></select>
        </div>
        <div style="margin:15px 0; color:#fff;">
            <label>Mật độ xe NPC: <span id="val-npc-density">5</span></label><br>
            <input type="range" id="setting-npc-density" min="0" max="20" value="5" style="width:100%;">
        </div>
        <div style="margin:15px 0; color:#fff;">
            <label>Độ nhạy Camera: <span id="val-cam-sens">30</span></label><br>
            <input type="range" id="setting-cam-sens" min="10" max="50" value="30" style="width:100%;">
        </div>
        <button id="btn-apply-settings" style="width:100%; padding:10px; cursor:pointer; background:#3b82f6; color:#fff; border:none; border-radius:5px;">ÁP DỤNG</button>
        <button id="btn-close-settings" style="width:100%; padding:5px; margin-top:5px; cursor:pointer; background:#ef4444; color:#fff; border:none; border-radius:5px;">ĐÓNG</button>
    </div>

    <!-- HUD GAMEPLAY -->
    <div id="hud" style="display:none;">
        <div id="hud-top-right">
            <div>📍 TUYẾN: <span id="hud-next-dest">Phú Yên → TP. HCM</span></div>
            <div>🚍 KHÁCH: <span id="hud-passengers">0/24</span></div>
            <div>🗺️ X: <span id="hud-x">0</span> | Z: <span id="hud-z">0</span></div>
            <div>⏰ <span id="hud-time">06:30</span> | FPS: <span id="hud-fps">0</span></div>
        </div>
        <div id="hud-minimap-container"><canvas id="hud-minimap" width="200" height="200"></canvas></div>
        <div id="hud-speedometer-container"><canvas id="hud-speedometer" width="180" height="180"></canvas></div>
        <div id="hud-warning" style="display:none;"></div>
        <div id="hud-notification"></div>
    </div>

    <!-- COMMAND CONSOLE -->
    <div id="command-console" style="display:none;">
        <div id="console-header">COMMAND CONSOLE <span style="float:right;">ESC ĐÓNG</span></div>
        <div id="console-output"></div>
        <div id="console-input-line">
            <span style="color:#3b82f6;">> </span><input type="text" id="console-input" autocomplete="off" placeholder="time 14/35" />
        </div>
    </div>

    <div id="mobile-controls" style="display:none;">
        <div id="steering-wheel"><div id="wheel-knob"></div></div>
        <button id="m-gas">GA</button>
        <button id="m-brake">PHANH</button>
        <button id="m-horn">📯</button>
        <button id="m-light">💡</button>
        <button id="m-door">🚪</button>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
